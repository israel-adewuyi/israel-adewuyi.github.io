<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data parallelism · mirror</title>
    <link rel="stylesheet" href="./parallel-mirror.css" />
  </head>
  <body>
    <main class="parallel-draft" data-draft-name="Mirror" data-phase="forward">
      <header class="dp-head">
        <span class="dp-kicker">Data parallelism</span>
      </header>

      <section class="stage" aria-label="Animated two-GPU data-parallelism diagram">
        <svg viewBox="0 0 900 430" role="img" aria-labelledby="mirror-title mirror-desc">
          <title id="mirror-title">Two-GPU data parallelism</title>
          <desc id="mirror-desc">
            Forward sends different batch shards through identical replicas. Backward averages local gradients using AllReduce.
          </desc>
          <defs>
            <marker id="a-blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d91c7" />
            </marker>
            <marker id="a-green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c9c74" />
            </marker>
            <marker id="a-muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#767a73" />
            </marker>
            <marker id="a-comm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06d3f" />
            </marker>
            <marker id="a-avg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6aa38" />
            </marker>
          </defs>

          <g class="forward-only">
            <text x="47" y="92" class="small-label mono">global batch</text>
            <rect x="42" y="105" width="118" height="96" class="structure" />
            <rect x="54" y="117" width="94" height="29" class="layer-accent" />
            <rect x="54" y="159" width="94" height="29" fill="#dceadf" stroke="#5c9c74" />
            <text x="101" y="136" text-anchor="middle" class="label mono">B₀</text>
            <text x="101" y="178" text-anchor="middle" class="label mono">B₁</text>
            <path d="M 160 132 C 205 132, 215 102, 273 102" class="flow" marker-end="url(#a-blue-arrow)" />
            <path d="M 160 174 C 205 174, 215 297, 273 297" class="flow-green" marker-end="url(#a-green-arrow)" />
            <circle r="5" class="data-token">
              <animateMotion dur="1.6s" repeatCount="indefinite" path="M 160 132 C 205 132, 215 102, 273 102" />
            </circle>
            <circle r="5" class="data-token-green">
              <animateMotion dur="1.6s" begin="0.35s" repeatCount="indefinite" path="M 160 174 C 205 174, 215 297, 273 297" />
            </circle>
          </g>

          <g aria-label="GPU zero replica">
            <rect x="275" y="45" width="350" height="115" class="structure" />
            <rect x="275" y="45" width="64" height="115" class="gpu-fill" />
            <text x="307" y="92" text-anchor="middle" class="label mono">GPU 0</text>
            <text x="307" y="111" text-anchor="middle" class="tiny-label mono">replica</text>
            <rect x="367" y="77" width="61" height="50" class="layer" />
            <rect x="448" y="77" width="61" height="50" class="layer" />
            <rect x="529" y="77" width="61" height="50" class="layer" />
            <text x="397" y="107" text-anchor="middle" class="small-label mono">layer 1</text>
            <text x="478" y="107" text-anchor="middle" class="small-label mono">layer 2</text>
            <text x="559" y="107" text-anchor="middle" class="small-label mono">layer 3</text>
          </g>

          <g aria-label="GPU one replica">
            <rect x="275" y="240" width="350" height="115" class="structure" />
            <rect x="275" y="240" width="64" height="115" class="gpu-fill" />
            <text x="307" y="287" text-anchor="middle" class="label mono">GPU 1</text>
            <text x="307" y="306" text-anchor="middle" class="tiny-label mono">replica</text>
            <rect x="367" y="272" width="61" height="50" class="layer" />
            <rect x="448" y="272" width="61" height="50" class="layer" />
            <rect x="529" y="272" width="61" height="50" class="layer" />
            <text x="397" y="302" text-anchor="middle" class="small-label mono">layer 1</text>
            <text x="478" y="302" text-anchor="middle" class="small-label mono">layer 2</text>
            <text x="559" y="302" text-anchor="middle" class="small-label mono">layer 3</text>
          </g>

          <g class="forward-only">
            <path d="M 340 102 H 610" class="flow" marker-end="url(#a-blue-arrow)" />
            <path d="M 340 297 H 610" class="flow-green" marker-end="url(#a-green-arrow)" />
            <circle r="4.5" class="data-token">
              <animateMotion dur="1.7s" repeatCount="indefinite" path="M 340 102 H 610" />
            </circle>
            <circle r="4.5" class="data-token-green">
              <animateMotion dur="1.7s" begin="0.35s" repeatCount="indefinite" path="M 340 297 H 610" />
            </circle>
            <path d="M 625 102 H 722" class="flow" marker-end="url(#a-blue-arrow)" />
            <path d="M 625 297 H 722" class="flow-green" marker-end="url(#a-green-arrow)" />
            <rect x="728" y="72" width="117" height="60" class="loss-fill" />
            <rect x="728" y="267" width="117" height="60" fill="#dceadf" stroke="#5c9c74" />
            <text x="786" y="98" text-anchor="middle" class="small-label mono">Loss</text>
            <text x="786" y="116" text-anchor="middle" class="label mono">L₀</text>
            <text x="786" y="293" text-anchor="middle" class="small-label mono">Loss</text>
            <text x="786" y="311" text-anchor="middle" class="label mono">L₁</text>
            <text x="450" y="390" text-anchor="middle" class="small-label mono">no cross-GPU communication</text>
          </g>

          <g class="backward-only">
            <text x="786" y="57" text-anchor="middle" class="small-label mono">local gradients</text>
            <rect x="728" y="72" width="117" height="60" class="comm-fill" />
            <rect x="728" y="267" width="117" height="60" class="comm-fill" />
            <text x="786" y="108" text-anchor="middle" class="label mono">g₀</text>
            <text x="786" y="303" text-anchor="middle" class="label mono">g₁</text>
            <path d="M 728 102 H 340" class="local-backward" marker-end="url(#a-muted-arrow)" />
            <path d="M 728 297 H 340" class="local-backward" marker-end="url(#a-muted-arrow)" />
            <circle r="4.5" fill="#767a73">
              <animateMotion dur="1.7s" repeatCount="indefinite" path="M 728 102 H 340" />
            </circle>
            <circle r="4.5" fill="#767a73">
              <animateMotion dur="1.7s" begin="0.35s" repeatCount="indefinite" path="M 728 297 H 340" />
            </circle>

            <path d="M 420 160 V 176" class="comm-line" marker-end="url(#a-comm-arrow)" />
            <path d="M 480 240 V 224" class="comm-line" marker-end="url(#a-comm-arrow)" />
            <circle r="6" class="grad-token">
              <animateMotion dur="1.1s" repeatCount="indefinite" path="M 420 160 V 176" />
            </circle>
            <circle r="6" class="grad-token">
              <animateMotion dur="1.1s" begin="0.3s" repeatCount="indefinite" path="M 480 240 V 224" />
            </circle>
            <rect x="300" y="176" width="300" height="48" rx="2" class="comm-fill pulse" />
            <text x="450" y="206" text-anchor="middle" class="allreduce-label mono">ALL-REDUCE</text>
            <path d="M 480 176 V 160" fill="none" stroke="#d6aa38" stroke-width="2.5" marker-end="url(#a-avg-arrow)" />
            <path d="M 420 224 V 240" fill="none" stroke="#d6aa38" stroke-width="2.5" marker-end="url(#a-avg-arrow)" />
            <circle r="5.5" class="avg-token">
              <animateMotion dur="1.1s" begin="0.55s" repeatCount="indefinite" path="M 480 176 V 160" />
            </circle>
            <circle r="5.5" class="avg-token">
              <animateMotion dur="1.1s" begin="0.55s" repeatCount="indefinite" path="M 420 224 V 240" />
            </circle>
          </g>
        </svg>
      </section>

      <nav class="phase-tabs" aria-label="Pass phase">
        <button type="button" data-phase-target="forward" aria-pressed="true">forward</button>
        <button type="button" data-phase-target="backward" aria-pressed="false">backward</button>
      </nav>
    </main>
    <script src="./parallel-mirror.js"></script>
  </body>
</html>
