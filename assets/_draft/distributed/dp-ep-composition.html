<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DP x EP composition - forward</title>
    <link rel="stylesheet" href="./parallel-mirror.css" />
    <link rel="stylesheet" href="./dp-ep-composition.css" />
  </head>
  <body>
    <main class="parallel-draft dp-ep-draft" data-phase="forward">
      <header class="dp-head">
        <span class="dp-kicker">Data x expert parallelism</span>
        <span class="dp-chip">top-2 / 2 DP replicas / 2 EP ranks / 4 GPUs</span>
      </header>

      <section class="stage dp-ep-stage" aria-label="Animated data- and expert-parallel composition">
        <svg viewBox="0 0 1080 650" role="img" aria-labelledby="dpep-title dpep-desc">
          <title id="dpep-title">Two data-parallel replicas, each implemented by a two-rank expert-parallel group</title>
          <desc id="dpep-desc">
            Four ranks receive four different input shards. Forward All-to-All exchanges stay inside each data replica.
            Backward uses two distinct reductions: expert gradients are AllReduced between matching expert owners across
            data replicas, while non-expert gradients are AllReduced across all four ranks.
          </desc>
          <defs>
            <marker id="dpep-blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d91c7" />
            </marker>
            <marker id="dpep-green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c9c74" />
            </marker>
            <marker id="dpep-comm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#e06d3f" />
            </marker>
          </defs>

          <text x="305" y="23" text-anchor="middle" class="dpep-replica-label mono">DP replica 0 / EP group 0</text>
          <text x="775" y="23" text-anchor="middle" class="dpep-replica-label mono">DP replica 1 / EP group 1</text>
          <rect x="95" y="37" width="420" height="510" class="dpep-replica-frame" />
          <rect x="565" y="37" width="420" height="510" class="dpep-replica-frame" />

          <text x="84" y="83" text-anchor="end" class="dpep-rank-label mono">EP rank 0</text>
          <text x="84" y="388" text-anchor="end" class="dpep-rank-label mono">EP rank 1</text>

          <g class="dpep-ep-zero" aria-label="Expert rank zero owns experts zero and one">
            <g aria-label="GPU zero, data replica zero, expert rank zero">
              <rect x="125" y="65" width="360" height="145" class="dpep-card" />
              <rect x="125" y="65" width="360" height="32" class="dpep-card-head" />
              <text x="141" y="87" class="label mono">GPU 0 / DP 0 / EP 0</text>
              <rect x="145" y="113" width="145" height="45" class="dpep-shared" />
              <rect x="305" y="113" width="160" height="45" class="dpep-expert" />
              <text x="217" y="140" text-anchor="middle" class="tiny-label mono">shared + router</text>
              <text x="385" y="140" text-anchor="middle" class="label mono">E0, E1</text>
              <rect x="205" y="172" width="200" height="25" class="dpep-input-zero" />
              <text x="305" y="189" text-anchor="middle" class="tiny-label mono">input shard 0</text>
            </g>
            <g aria-label="GPU two, data replica one, expert rank zero">
              <rect x="595" y="65" width="360" height="145" class="dpep-card" />
              <rect x="595" y="65" width="360" height="32" class="dpep-card-head" />
              <text x="611" y="87" class="label mono">GPU 2 / DP 1 / EP 0</text>
              <rect x="615" y="113" width="160" height="45" class="dpep-expert" />
              <rect x="790" y="113" width="145" height="45" class="dpep-shared" />
              <text x="695" y="140" text-anchor="middle" class="label mono">E0, E1</text>
              <text x="862" y="140" text-anchor="middle" class="tiny-label mono">shared + router</text>
              <rect x="675" y="172" width="200" height="25" class="dpep-input-zero" />
              <text x="775" y="189" text-anchor="middle" class="tiny-label mono">input shard 2</text>
            </g>
          </g>

          <g class="dpep-ep-one" aria-label="Expert rank one owns experts two and three">
            <g aria-label="GPU one, data replica zero, expert rank one">
              <rect x="125" y="370" width="360" height="145" class="dpep-card" />
              <rect x="125" y="370" width="360" height="32" class="dpep-card-head" />
              <text x="141" y="392" class="label mono">GPU 1 / DP 0 / EP 1</text>
              <rect x="145" y="418" width="145" height="45" class="dpep-shared" />
              <rect x="305" y="418" width="160" height="45" class="dpep-expert" />
              <text x="217" y="445" text-anchor="middle" class="tiny-label mono">shared + router</text>
              <text x="385" y="445" text-anchor="middle" class="label mono">E2, E3</text>
              <rect x="205" y="477" width="200" height="25" class="dpep-input-one" />
              <text x="305" y="494" text-anchor="middle" class="tiny-label mono">input shard 1</text>
            </g>
            <g aria-label="GPU three, data replica one, expert rank one">
              <rect x="595" y="370" width="360" height="145" class="dpep-card" />
              <rect x="595" y="370" width="360" height="32" class="dpep-card-head" />
              <text x="611" y="392" class="label mono">GPU 3 / DP 1 / EP 1</text>
              <rect x="615" y="418" width="160" height="45" class="dpep-expert" />
              <rect x="790" y="418" width="145" height="45" class="dpep-shared" />
              <text x="695" y="445" text-anchor="middle" class="label mono">E2, E3</text>
              <text x="862" y="445" text-anchor="middle" class="tiny-label mono">shared + router</text>
              <rect x="675" y="477" width="200" height="25" class="dpep-input-one" />
              <text x="775" y="494" text-anchor="middle" class="tiny-label mono">input shard 3</text>
            </g>
          </g>

          <g class="forward-only" aria-label="Forward pass">
            <path d="M 150 210 V 370" class="dpep-token-zero-path" marker-start="url(#dpep-blue-arrow)" marker-end="url(#dpep-blue-arrow)" />
            <path d="M 460 210 V 370" class="dpep-token-one-path" marker-start="url(#dpep-green-arrow)" marker-end="url(#dpep-green-arrow)" />
            <rect x="225" y="259" width="160" height="60" class="dpep-a2a-box" />
            <text x="305" y="284" text-anchor="middle" class="dpep-a2a-title mono">ALL-TO-ALL</text>
            <text x="305" y="304" text-anchor="middle" class="dpep-a2a-detail mono">dispatch + combine</text>
            <circle r="5" class="dpep-zero-dot"><animateMotion dur="1.8s" repeatCount="indefinite" path="M 150 210 V 370" /></circle>
            <circle r="5" class="dpep-zero-dot"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 150 370 V 210" /></circle>
            <circle r="5" class="dpep-one-dot"><animateMotion dur="1.8s" begin="0.35s" repeatCount="indefinite" path="M 460 370 V 210" /></circle>
            <circle r="5" class="dpep-one-dot"><animateMotion dur="1.8s" begin="1.25s" repeatCount="indefinite" path="M 460 210 V 370" /></circle>

            <path d="M 620 210 V 370" class="dpep-token-zero-path" marker-start="url(#dpep-blue-arrow)" marker-end="url(#dpep-blue-arrow)" />
            <path d="M 930 210 V 370" class="dpep-token-one-path" marker-start="url(#dpep-green-arrow)" marker-end="url(#dpep-green-arrow)" />
            <rect x="695" y="259" width="160" height="60" class="dpep-a2a-box" />
            <text x="775" y="284" text-anchor="middle" class="dpep-a2a-title mono">ALL-TO-ALL</text>
            <text x="775" y="304" text-anchor="middle" class="dpep-a2a-detail mono">dispatch + combine</text>
            <circle r="5" class="dpep-zero-dot"><animateMotion dur="1.8s" begin="0.2s" repeatCount="indefinite" path="M 620 210 V 370" /></circle>
            <circle r="5" class="dpep-zero-dot"><animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" path="M 620 370 V 210" /></circle>
            <circle r="5" class="dpep-one-dot"><animateMotion dur="1.8s" begin="0.55s" repeatCount="indefinite" path="M 930 370 V 210" /></circle>
            <circle r="5" class="dpep-one-dot"><animateMotion dur="1.8s" begin="1.45s" repeatCount="indefinite" path="M 930 210 V 370" /></circle>

            <rect x="448" y="558" width="184" height="42" class="structure" />
            <text x="540" y="575" text-anchor="middle" class="dpep-forward-note mono">DP replicas are independent</text>
            <text x="540" y="590" text-anchor="middle" class="dpep-forward-note mono">during forward</text>
            <text x="540" y="628" text-anchor="middle" class="small-label mono">each replica performs its own top-2 expert routing</text>
          </g>

          <g class="backward-only" aria-label="Backward pass">
            <path d="M 145 136 H 110 V 441 H 145 M 110 441 V 582 H 325" class="dpep-nonexpert-ar-path" marker-end="url(#dpep-comm-arrow)" />
            <path d="M 935 136 H 970 V 441 H 935 M 970 441 V 582 H 755" class="dpep-nonexpert-ar-path" marker-end="url(#dpep-comm-arrow)" />
            <rect x="325" y="553" width="430" height="58" class="dpep-shared-ar-box" />
            <text x="540" y="577" text-anchor="middle" class="dpep-ar-title mono">NON-EXPERT-GRADIENT ALL-REDUCE</text>
            <text x="540" y="597" text-anchor="middle" class="dpep-ar-detail mono">shared + router parameters / all 4 ranks</text>

            <path d="M 150 210 V 370" class="dpep-token-zero-path" marker-start="url(#dpep-blue-arrow)" marker-end="url(#dpep-blue-arrow)" />
            <path d="M 460 210 V 370" class="dpep-token-one-path" marker-start="url(#dpep-green-arrow)" marker-end="url(#dpep-green-arrow)" />
            <rect x="225" y="263" width="160" height="52" class="dpep-a2a-box" />
            <text x="305" y="285" text-anchor="middle" class="dpep-a2a-title mono">ALL-TO-ALL</text>
            <text x="305" y="302" text-anchor="middle" class="dpep-a2a-detail mono">token-gradient routing</text>

            <path d="M 620 210 V 370" class="dpep-token-zero-path" marker-start="url(#dpep-blue-arrow)" marker-end="url(#dpep-blue-arrow)" />
            <path d="M 930 210 V 370" class="dpep-token-one-path" marker-start="url(#dpep-green-arrow)" marker-end="url(#dpep-green-arrow)" />
            <rect x="695" y="263" width="160" height="52" class="dpep-a2a-box" />
            <text x="775" y="285" text-anchor="middle" class="dpep-a2a-title mono">ALL-TO-ALL</text>
            <text x="775" y="302" text-anchor="middle" class="dpep-a2a-detail mono">token-gradient routing</text>

            <path d="M 465 136 H 615" class="dpep-comm-path" marker-start="url(#dpep-comm-arrow)" marker-end="url(#dpep-comm-arrow)" />
            <rect x="490" y="103" width="100" height="66" class="dpep-expert-ar-box" />
            <text x="540" y="123" text-anchor="middle" class="dpep-ar-title mono">EXPERT-GRADIENT</text>
            <text x="540" y="139" text-anchor="middle" class="dpep-ar-title mono">ALL-REDUCE</text>
            <text x="540" y="156" text-anchor="middle" class="dpep-ar-detail mono">E0, E1 replicas</text>
            <circle r="5" class="dpep-comm-dot"><animateMotion dur="1.45s" repeatCount="indefinite" path="M 465 136 H 615" /></circle>

            <path d="M 465 441 H 615" class="dpep-comm-path" marker-start="url(#dpep-comm-arrow)" marker-end="url(#dpep-comm-arrow)" />
            <rect x="490" y="408" width="100" height="66" class="dpep-expert-ar-box" />
            <text x="540" y="428" text-anchor="middle" class="dpep-ar-title mono">EXPERT-GRADIENT</text>
            <text x="540" y="444" text-anchor="middle" class="dpep-ar-title mono">ALL-REDUCE</text>
            <text x="540" y="461" text-anchor="middle" class="dpep-ar-detail mono">E2, E3 replicas</text>
            <circle r="5" class="dpep-comm-dot"><animateMotion dur="1.45s" begin="0.4s" repeatCount="indefinite" path="M 615 441 H 465" /></circle>

            <text x="540" y="635" text-anchor="middle" class="small-label mono">two reducers follow the two parameter-replication patterns</text>
          </g>
        </svg>
      </section>

      <nav class="phase-tabs" aria-label="Pass phase">
        <button type="button" data-phase-target="forward" aria-pressed="true">forward</button>
        <button type="button" data-phase-target="backward" aria-pressed="false">backward</button>
      </nav>
    </main>

    <script>
      (() => {
        const root = document.querySelector(".parallel-draft");
        const buttons = Array.from(root.querySelectorAll("[data-phase-target]"));

        function setPhase(phase) {
          if (phase !== "forward" && phase !== "backward") return;
          root.dataset.phase = phase;
          buttons.forEach((button) => {
            button.setAttribute("aria-pressed", String(button.dataset.phaseTarget === phase));
          });
          document.title = `DP x EP composition - ${phase}`;
        }

        buttons.forEach((button) => {
          button.addEventListener("click", () => setPhase(button.dataset.phaseTarget));
        });

        const requestedPhase = new URLSearchParams(window.location.search).get("phase");
        setPhase(requestedPhase === "backward" ? "backward" : "forward");
        window.setPhase = setPhase;
      })();
    </script>
  </body>
</html>
